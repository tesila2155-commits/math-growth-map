de":6,"module":"综合与实践","required_prerequisites":["P04","P05"],"conditional_support":[],"status":"结构草案，待按教材逐册核对","release":"graph-draft","course_check":"待按教材逐册校核","ready":false},{"id":"P07","title":"数量关系建模（等量分组）","suggested_grade":3,"module":"综合与实践","required_prerequisites":["N06"],"conditional_support":["P03"],"status":"V4.0新增细分节点；依赖关系待审查","release":"new-v4-pilot","course_check":"待按教材逐册校核","ready":true,"focus":"用“每份量×份数=总量”描述不同的真实问题","skills":["model","represent","structure","reason","transfer","meta"],"intro":"model"}],"abilities":[{"id":"represent","name":"理解与表征","group":"通用数学认知与问题解决","icon":"✏️","kid":"给数学换件衣服","definition":"同一件数学事情，可以用文字、图画、表格或算式表达。","why":"题目没看懂时，换一种画法或说法，常常就能看清数量之间的关系。","story":"“3盘苹果，每盘4个”可以画成3组圆点，也能写成3×4。","example":"3盘，每盘4个 → 3×4","question":"下面哪个算式能表示“3盘，每盘4个”？","choices":["3+4","3×4","4−3"],"correct":1,"feedback":"每盘4个，有3盘，是3组4。","indicators":["能提取数量与目标","能画图或列式表示关系","能在文字、图画和算式间换表示"],"standard":"不看范例，能用两种方式表示同一关系。","standard_high":"换了情境后，仍能选出恰当的表达方式。","core":["符号意识","几何直观"],"universal":{"title":"给一件事换一种说法","story":"“三个篮子，每个四个橘子”可以画三组点，也可以写成3×4。","explain":"表征，是用语言、图、符号或动作来表达同一件事。","benefit":"解释自己的想法、读地图、理解复杂说明都会更容易。","first":"🗣️","second":"🖼️","bridge":"故事 ↔ 图 ↔ 符号"}},{"id":"structure","name":"分类与结构识别","group":"通用数学认知与问题解决","icon":"🔎","kid":"找到题目藏着的同一个秘密","definition":"把题目放在一起比较，看它们哪里不一样、哪里其实一样。","why":"以后遇到新题，你会想起以前学过的“老朋友”，不用从头猜办法。","story":"3盒彩笔、每盒4支；3篮橘子、每篮4个。东西变了，“3组4”没变。","example":"彩笔3×4 ＝ 橘子3×4","question":"“2盘，每盘5个”和哪道题有相同的数量结构？","choices":["5个分给2人","2盒，每盒5颗","2颗加5颗"],"correct":1,"feedback":"两道题都是“2组，每组5个”。","indicators":["能根据数学关系分类","能比较题目中变与不变的部分","能识别隐藏在新情境中的共同结构"],"standard":"能说出两道题相同的数量关系，而不只说数字相同。","standard_high":"能用相同结构解决不同情境的问题。","core":["数感","推理意识"],"universal":{"title":"发现它们像在哪里","story":"2个盘子每盘5个苹果，2排椅子每排5把，看起来不同，却都有“两组5个”。","explain":"分类与结构识别，是按有意义的共同特点把事物联系起来。","benefit":"学会找相同和不同，能更快找到解决新问题的入口。","first":"🍎","second":"🪑","bridge":"不同外表 · 相同关系"}},{"id":"abstract","name":"抽象与概括","group":"通用数学认知与问题解决","icon":"🧠","kid":"把复杂故事变成简单规律","definition":"先暂时放下苹果、盒子等具体东西，留下真正重要的数量或关系。","why":"学会抽象，一条规律就能帮你解决许多不同故事里的问题。","story":"3盘4个苹果、3包4块饼干，虽然东西不同，都可以只留下“3×4”。","example":"苹果 / 饼干 → 3 × 4","question":"三个盒子，每盒都有5件东西。不管是什么东西，都可以写成？","choices":["3×5","3+5","5−3"],"correct":0,"feedback":"拿掉物品名字，保留“3组，每组5件”的关系，就是抽象。","indicators":["能去掉无关故事信息","能用数或符号概括共同关系","能提出适用范围明确的一般规律"],"standard":"能从两个具体例子提取共同的数学关系。","standard_high":"能说明概括的规律在什么条件下成立。","core":["数感","符号意识"],"universal":{"title":"从不同的东西里，发现同一个秘密","story":"🍎 3个苹果 + 2个苹果，🧸 3只小熊 + 2只小熊，东西不一样，“3+2”的关系一样。","explain":"你在做的事叫抽象：先放下不重要的外表，留下最重要的共同点。","benefit":"能看懂许多新问题背后其实有同一个规律。","first":"🍎","second":"🧸","bridge":"3 + 2"}},{"id":"reason","name":"逻辑推理与论证","group":"通用数学认知与问题解决","icon":"🧩","kid":"不仅说答案，还能说为什么","definition":"数学里的逻辑，就是根据已知条件，一步步推理，检查结论能不能成立，并说出理由。","why":"学会逻辑推理，别人问“为什么”时，你能给出有根据的解释，还能发现不合理的说法。","story":"如果每盒有4支笔，3盒就是4+4+4，所以可以写成3×4。","example":"知道的事实 → 理由 → 结论","question":"为什么3×4可以表示4+4+4？","choices":["因为数字里有3和4","因为是3个4相加","因为乘法总比加法大"],"correct":1,"feedback":"理由要能连接已知事实与结论，不能只看数字像不像。","indicators":["能说明每一步的理由","能区分事实与猜测","能用反例检验一个说法"],"standard":"能指出解法中的关键依据。","standard_high":"能主动寻找反例或说明适用条件。","core":["推理意识"],"universal":{"title":"做一名能说清“为什么”的小侦探","story":"地上有水印，天空有乌云。是刚下过雨吗？也可能是有人洒了水。","explain":"逻辑推理，就是把理由和结论认真连起来，检查有没有遗漏的可能。","benefit":"别人说什么你都能认真判断，不轻易被表面现象骗到。","first":"☁️","second":"💧","bridge":"证据 → 结论"}},{"id":"transform","name":"转化与化归","group":"通用数学认知与问题解决","icon":"🔁","kid":"把难题变成会做的题","definition":"把一道难题换个样子，变成已经会解决的简单问题，同时保持重要关系不变。","why":"遇到不会的题，不必只等别人教你新方法，你还可以自己找一条熟悉的路。","story":"算6×12，可以改成6×(10+2)，再算60+12。","example":"6×12 → 6×10+6×2","question":"6×12换成哪种写法，结果一定相同？","choices":["6×10+2","6×10+6×2","6+10+2"],"correct":1,"feedback":"12被拆成10和2，每一部分都要乘6，总数才不变。","indicators":["能改变表示并保持等价","能把复杂问题分成较易的部分","能解释转化前后什么没有改变"],"standard":"能独立完成一种保持关系不变的转化。","standard_high":"能比较两种转化并选择更合适的。","core":["运算能力","推理意识"],"universal":{"title":"换条路，难题也许就简单了","story":"长长的队伍不容易数？先分成几组，每组数完再合起来。","explain":"转化与化归，就是把不好处理的事变成自己更熟悉的事。","benefit":"碰到困难时，多一种思路，就多一个解决问题的机会。","first":"🧩","second":"🪜","bridge":"复杂 → 熟悉"}},{"id":"model","name":"建模与问题解决","group":"通用数学认知与问题解决","icon":"🏗️","kid":"用数学搭一座解决问题的桥","definition":"从真实事情中找到重要的数量，把它们之间的关系变成图、表格或算式。","why":"你会发现数学不只在作业本上，还能帮你计划购物、分组和测量。","story":"4盒铅笔，每盒3支：先找“盒数”和“每盒支数”，用4×3算总数。","example":"现实故事 → 找数量 → 关系式 → 解释","question":"想知道4盒、每盒3支的铅笔总数，最关键的关系是？","choices":["4+3=7","4×3=12","4−3=1"],"correct":1,"feedback":"模型要让数量关系与真实问题一致，而不只是把出现的数字随便计算。","indicators":["能找出必要数量和条件","能建立与情境一致的关系式","能检查结果在原情境是否合理"],"standard":"能把简单情境转成正确的数量关系。","standard_high":"能修改假设并判断模型是否仍适用。","core":["模型意识","应用意识"],"universal":{"title":"把复杂世界变成好理解的小地图","story":"生日聚会有4桌，每桌坐6个人。你不必一个个数，用“4组×每组6人”就能描述。","explain":"建模，就是挑出真正重要的信息，用图、表、数字或规则重新表达一件事。","benefit":"安排时间、购物、做计划，都能用一个好模型少走弯路。","first":"🎉","second":"🪑","bridge":"现实 → 模型"}},{"id":"number","name":"数感与运算","group":"数学领域性能力","icon":"🔢","kid":"让数字变得有感觉","definition":"看见数字，就能大致知道数量大小，还能选择合适的方法准确计算。","why":"你能提前判断一个结果合不合理，也可以找到更省力的算法。","story":"49+51不必一个个数，凑成100更快。","example":"49 + 51 = 100","question":"49+51最接近哪个数？","choices":["50","100","200"],"correct":1,"feedback":"49和51刚好凑成100，这也能帮助你检查计算结果。","indicators":["能估计数量和结果范围","能准确选择并执行运算","能用不同算法验证结果"],"standard":"能在具体任务中选出合适的计算策略。","standard_high":"能解释为什么结果合理。","core":["数感","运算能力"],"universal":{"title":"把「数感与运算」用到生活中","story":"49+51不必一个个数，凑成100更快。","explain":"看见数字，就能大致知道数量大小，还能选择合适的方法准确计算。","benefit":"你能提前判断一个结果合不合理，也可以找到更省力的算法。","first":"🔎","second":"✨","bridge":"49 + 51 = 100"}},{"id":"measure","name":"量感与测量","group":"数学领域性能力","icon":"📏","kid":"让长度和面积看得见","definition":"知道什么可以用长度、面积或时间来描述，并选择合适的单位测量。","why":"你能知道一条边有多长、一张桌面有多大，也不容易把厘米和平方厘米弄混。","story":"量桌子边缘的长度用厘米；量桌面铺了多大一片用平方厘米。","example":"边的长度：厘米 · 面的大小：平方厘米","question":"想知道一本书封面有多大，该用什么量？","choices":["长度","面积","重量"],"correct":1,"feedback":"书封面占据的平面大小是面积，可以用平方厘米衡量。","indicators":["能选择正确的测量属性","能使用适当的单位","能估测并检查单位和结果"],"standard":"能区分常见量及其单位。","standard_high":"能用单位方格解释面积。","core":["量感"],"universal":{"title":"把「量感与测量」用到生活中","story":"量桌子边缘的长度用厘米；量桌面铺了多大一片用平方厘米。","explain":"知道什么可以用长度、面积或时间来描述，并选择合适的单位测量。","benefit":"你能知道一条边有多长、一张桌面有多大，也不容易把厘米和平方厘米弄混。","first":"🔎","second":"✨","bridge":"边的长度：厘米 · 面的大小：平方厘米"}},{"id":"space","name":"几何直观与空间","group":"数学领域性能力","icon":"▦","kid":"用图形帮大脑思考","definition":"借助线段、格子或图形看清位置、形状和数量关系。","why":"有些算式很难想象，画出来以后就更容易发现隐藏的关系。","story":"把4×3看成4行、每行3格，就能一眼看到12格。","example":"4行 × 3格 = 12格","question":"4行，每行3个小方格，总共有几个？","choices":["7","12","43"],"correct":1,"feedback":"每行3个、共有4行，图形对应4×3。","indicators":["能读懂数学图形","能用图形表示数量关系","能利用图形发现新的解题方法"],"standard":"能画出能帮助解决问题的简单图。","standard_high":"能把图形中的结构与算式互相解释。","core":["几何直观","空间观念"],"universal":{"title":"把「几何直观与空间」用到生活中","story":"把4×3看成4行、每行3格，就能一眼看到12格。","explain":"借助线段、格子或图形看清位置、形状和数量关系。","benefit":"有些算式很难想象，画出来以后就更容易发现隐藏的关系。","first":"🔎","second":"✨","bridge":"4行 × 3格 = 12格"}},{"id":"data","name":"数据与不确定性","group":"数学领域性能力","icon":"📊","kid":"从一堆数字里读出故事","definition":"把观察到的数据整理好，寻找有用的信息，也知道有些事情只是可能发生。","why":"你能比较不同情况，用数据说明想法，而不是只凭感觉猜。","story":"三天分别读2、4、6页，平均每天是4页，但不是每天都读了4页。","example":"2、4、6 → 平均数4","question":"三天读2、4、6页，平均每天4页，说明什么？","choices":["每天都读4页","三天总页数相当于每天4页","第一天读4页"],"correct":1,"feedback":"平均数是在说整体水平，不代表每一次都刚好是这个数。","indicators":["能整理并读懂数据","能理解平均数与变化","能区分事实数据与推测"],"standard":"能根据一组数据提出合理的解释。","standard_high":"能说明统计结论的限制。","core":["数据意识"],"universal":{"title":"把「数据与不确定性」用到生活中","story":"三天分别读2、4、6页，平均每天是4页，但不是每天都读了4页。","explain":"把观察到的数据整理好，寻找有用的信息，也知道有些事情只是可能发生。","benefit":"你能比较不同情况，用数据说明想法，而不是只凭感觉猜。","first":"🔎","second":"✨","bridge":"2、4、6 → 平均数4"}},{"id":"transfer","name":"迁移与综合应用","group":"跨领域学习与发展","icon":"🧭","kid":"把学过的本领带去新地方","definition":"题目换了外表，你还能认出熟悉的数量关系，把已经学过的方法用起来。","why":"学一个方法不只能做一种题，去解决没见过的新问题，学习就变得更有力量。","story":"学过算每盒铅笔总数，也可以用同样关系算每排座位数。","example":"每盒3支×4盒 → 每排3座×4排","question":"算“每盒3支，有4盒”的方法，还适合哪个问题？","choices":["4排座位，每排3个","4支笔送出3支","4个人排成一队"],"correct":0,"feedback":"物品变了，但“4组，每组3个”的关系没有变。","indicators":["能识别新旧题目的共同结构","能独立选择旧方法解决新情境","能指出迁移不适用的边界"],"standard":"能在外表不同但结构相同的题目中独立应用。","sta ":"比较题目的条件、关系和表达方式","validation":"模板数学逻辑初审；课堂教学效果未验证","options":["一共只有5颗","每组都有3+2颗","只需要算红珠"]},{"id":"N12-S1-Q04","node":"N12","stage":1,"prompt":"4×5=？","kind":"input","answer":"20","why":"4组5相加，得到20。","relation":"乘法基本运算","primary":"number","secondary":"represent","hint":"先找数量之间的关系，想想有没有画图或换一种说法的办法。","structure":"乘法基本运算","variation":"比较题目的条件、关系和表达方式","validation":"模板数学逻辑初审；课堂教学效果未验证"},{"id":"N12-S2-Q01","node":"N12","stage":2,"prompt":"3×(4+2) 可以画成哪种图？","kind":"choice","answer":"3组，每组4红2蓝","why":"三组中每一组都有4红2蓝。","relation":"文字↔式子","primary":"represent","secondary":"represent","hint":"先找数量之间的关系，想想有没有画图或换一种说法的办法。","structure":"文字↔式子","variation":"比较题目的条件、关系和表达方式","validation":"模板数学逻辑初审；课堂教学效果未验证","options":["3组，每组4红2蓝","4组，每组3红2蓝","一组4红，另加2蓝"],"visual":{"kind":"groups","groups":3,"a":4,"b":2}},{"id":"N12-S2-Q02","node":"N12","stage":2,"prompt":"3×(4+2) 与哪个算式表示同一个总数？","kind":"choice","answer":"3×4+3×2","why":"把每一组的两部分分别统计，都要乘3。","relation":"整体↔分块","primary":"transform","secondary":"represent","hint":"先找数量之间的关系，想想有没有画图或换一种说法的办法。","structure":"整体↔分块","variation":"比较题目的条件、关系和表达方式","validation":"模板数学逻辑初审；课堂教学效果未验证","options":["3×4+3×2","3×4+2","3+4+2"],"visual":{"kind":"groups","groups":3,"a":4,"b":2}},{"id":"N12-S2-Q03","node":"N12","stage":2,"prompt":"用下面的卡片拼出“3组，每组4红2蓝”的总数关系。","kind":"build","answer":["3","×","(","4","+","2",")"],"why":"括号表示每组有4+2，再乘3组。","relation":"图示↔符号","primary":"represent","secondary":"represent","hint":"先找数量之间的关系，想想有没有画图或换一种说法的办法。","structure":"图示↔符号","variation":"把生活语言压缩成算式","validation":"模板数学逻辑初审；课堂教学效果未验证","options":[")","2","+","4","(","×","3"]},{"id":"N12-S2-Q04","node":"N12","stage":2,"prompt":"3×4+3×2 = ？","kind":"input","answer":"18","why":"红珠12颗，蓝珠6颗，共18颗。","relation":"分块数量表达","primary":"number","secondary":"represent","hint":"先找数量之间的关系，想想有没有画图或换一种说法的办法。","structure":"分块数量表达","variation":"比较题目的条件、关系和表达方式","validation":"模板数学逻辑初审；课堂教学效果未验证"},{"id":"N12-S2-Q05","node":"N12","stage":2,"prompt":"长方形宽3格，长被分成4格与2格，哪种算式求整个面积？","kind":"choice","a   <script>/* 数学能力生长与自主学习系统 V4.1 · 第一阶段（离线原型） */
(() => {
'use strict';

const h=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const profileDefault=(name='我的档案',grade=4)=>({name,grade,introduced:{},attempts:[],sessions:[],activeSession:null,legacyArchive:null,created:Date.now()});

 const v=storageGet(STORE);if(v?.version===4 && v.profiles && Object.keys(v.profiles).length)return v;
 const result={version:4,active:'我的档案',profiles:{'我的档案':profileDefault()},migration:{when:null,found:false}};
 const old=storageGet(OLD), all=storageGet(OLD_PROFILES);
 if(old?.version===29 || all && typeof all==='object'){
   result.profiles={};
   if(all && typeof all==='object')for(const [name,val] of Object.entries(all))if(name){let p=profileDefault(name,Number(String(val?.grade||old?.grade||'4').replace(/[^0-9]/g,''))||4);p.legacyArchive=val||null;result.profiles[name]=p;}
   if(old?.version===29){let name=old.profile||'原有学习档案';if(!result.profiles[name])result.profiles[name]=profileDefault(name,Number(String(old.grade||'4').replace(/[^0-9]/g,''))||4);result.profiles[name].legacyArchive=old;result.active=name;}
   if(!Object.keys(result.profiles).length)result.profiles['我的档案']=profileDefault();
   if(!result.profiles[result.active])result.active=Object.keys(result.profiles)[0];
   result.migration={when:Date.now(),found:true};
 }
 storageSet(STORE,result);return result;
};

 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();if(audioCtx.state==='suspended')audioCtx.resume();let osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),now=audioCtx.currentTime;osc.type='sine';osc.frequency.setValueAtTime(kind==='success'?523:kind==='complete'?660:kind==='retry'?330:480,now);if(kind==='success')osc.frequency.exponentialRampToValueAtTime(659,now+.10);gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.055,now+.012);gain.gain.exponentialRampToValueAtTime(.0001,now+.14);osc.connect(gain).connect(audioCtx.destination);osc.start(now);osc.stop(now+.15);}catch(_){}
}

 if(act==='ability-branch'){abilityScene=Number(id);render();return;}

 if(act==='ability-hurdle-start'){const i=Number(id);if(i===0){startIntro(route.id,'ability');return;}if(i===1){beginTraining(null,route.id,'ability',false);return;}if(i===2){abilityMode='transfer';bookMotion='next';render();return;}const due=getDue().filter(t=>t.primary===route.id||t.secondary===route.id);if(due.length){beginTraining(null,route.id,'ability',true);}else{alert('这项本领暂时没有到期的复测题。可以先去其他岛屿探索。');}return;}if(act==='story-hurdle'){abilityStage=Number(id);render();return;}if(act==='story-ability-branch'){abilityStage=Number(id);render();return;}if(act==='story-island'){if(id==='0')startIntro(route.id,'ability');else beginTraining(null,route.id,'ability',id==='3');return;}if(act==='story-mind-lab'){abilityLabStep=Number(id);mindLabOffset={x:0,y:0};render();return;}if(act==='story-turn'||act==='story-goto'){const [k,v]=String(id).split(':');const pages=v48BookPages(k);if(k==='knowledge'){let i=pages.findIndex(x=>x[0]===universeUI.view);let j=act==='story-turn'?Math.max(0,Math.min(pages.length-1,i+Number(v))):Number(v);bookMotion=j<i?'prev':'next';universeUI.view=pages[j][0];}else{let i=pages.findIndex(x=>x[0]===abilityMode),j=act==='story-turn'?Math.max(0,Math.min(pages.length-1,i+Number(v))):Number(v);bookMotion=j<i?'prev':'next';abilityMode=pages[j][0];}render();return;}if(act==='story-group'){universeUI.cluster=Number(id);render();return;}if(act==='story-metro'){universeUI.metro=Number(id);render();return;}if(act==='story-lab-plus'){updateStoryLab((universeUI.labSplit||3)+1);return;}if(act==='kv-view'){universeUI.view=id;render();return;}if(act==='kv-metro'){universeUI.metro=Number(id);render();return;}if(act==='kv-step'){universeUI.step=Number(id);render();return;}
 if(act==='ability-mode'){abilityMode=id;abilityLabStep=0;abilityLabChoice=-1;render();return;}
 if(act==='ability-island'){if(id==='0'){startIntro(route.id,'ability');return;}beginTraining(null,route.id,'ability',id==='3');return;}
 if(act==='ability-lab-choice'){abilityLabChoice=Number(id);render();return;}
 if(act==='ability-lab-prev'){abilityLabStep=Math.max(0,abilityLabStep-1);render();return;}
 if(act==='ability-lab-next'){if(abilityLabStep===1&&abilityLabChoice<0)return;abilityLabStep=(abilityLabStep+1)%3;if(abilityLabStep===0)abilityLabChoice=-1;render();return;}

 if(act==='note-discovery'){let answer=window.prompt('你刚刚发现了什么规律？可以用自己的话说。');if(!answer||!answer.trim())return;let p=cur();p.discoveries=p.discoveries||[];p.discoveries.push({at:Date.now(),text:answer.trim().slice(0,240)});persist();render();return;}
 if(act==='growth-tab'){growthUI.tab=id==='ability'?'ability':'knowledge';growthUI.expanded=false;growthUI.limit=12;render();return;}
 if(act==='growth-expand'){growthUI.expanded=!growthUI.expanded;render();return;}
 if(act==='growth-more'){growthUI.limit+=12;render();return;}
 if(act==='cosmos-mode'){universeUI.links=id==='all'?'all':'focus';drawUniverse();return;}
 if(act==='cosmos-labels'){universeUI.showLabels=!universeUI.showLabels;render();return;}
 if(act==='cosmos-cluster'){const i=Number(id);universeUI.cluster=i;const centers=[[235,225],[845,220],[245,570],[830,565],[550,390]];universeState.zoom=1.55;universeState.x=550-centers[i][0]*1.55;universeState.y=390-centers[i][1]*1.55;render();return;}
 if(act==='cosmos-close-cluster'){universeUI.cluster=null;universeState.selected=null;universeState.zoom=1;universeState.x=0;universeState.y=0;render();return;}
 if(act==='cosmos-clear'){universeState.selected=null;render();return;}
 if(act==='cosmos-focus'){universeState.selected=id;let n=node(id),idx=D.knowledgeSections.indexOf(n?.module);universeUI.cluster=idx>=0?idx:null;let p=universeLayout().find(x=>x.n.id===id);if(p){universeState.zoom=1.8;universeState.x=550-p.x*1.8;universeState.y=390-p.y*1.8;}render();return;}
 if(act==='cosmos-find'){const input=$('cosmosSearch');let q=(input?.value||'').trim();universeUI.search=q;if(!q)return;let n=D.nodes.find(x=>x.title.includes(q)||x.id.toLowerCase()===q.toLowerCase());if(!n){alert('暂时没找到这个知识点，可以换个关键词试试。');return;}let p=universeLayout().find(x=>x.n.id===n.id);universeState.selected=n.id;universeUI.cluster=D.knowledgeSections.indexOf(n.module);universeState.zoom=1.8;universeState.x=550-p.x*1.8;universeState.y=390-p.y*1.8;render();return;}
 if(act==='sound'){toggleSound();return;}if(act==='speak'){speakConcept(id);return;}if(act==='stop-speak'){window.speechSynthesis?.cancel();return;}if(act==='universe-select'){universeState.selected=id;universeUI.cluster=D.knowledgeSections.indexOf(node(id)?.module);universeState.zoom=Math.max(1.12,universeState.zoom);render();return;}if(act==='universe-zoom-in'){universeState.zoom=Math.min(3,universeState.zoom*1.25);drawUniverse();return;}if(act==='universe-zoom-out'){universeState.zoom=Math.max(.5,universeState.zoom/1.25);drawUniverse();return;}if(act==='universe-reset'){universeState={zoom:1,x:0,y:0,selected:null};universeUI.search='';universeUI.cluster=null;render();return;}if(act==='nav'){navigate(el.dataset.page);return;}
 if(act==='knowledge'){navigate('knowledge');return;}
 if(act==='resume'){if(cur().activeSession)navigate('session');else navigate('home');return;}
 if(act==='ability'){navigate('ability',{id});return;}
 if(act==='node'){navigate('node',{id});return;}
 if(act==='recommend'){let r=recommended();if(r.type==='review')beginTraining(null,getDue()[0]?.primary||'transfer','ability',true);else beginTraining(r.id,null,'node');return;}
 if(act==='intro'){startIntro(id,el.dataset.return);return;}
 if(act==='start-node'){beginTraining(id,null,'node');return;}
 if(act==='start-ability'){beginTraining(null,id,'ability');return;}
 if(act==='start-review'){beginTraining(null,getDue()[0]?.primary||'transfer','ability',true);return;}
 if(act==='intro-next'){route.step=Math.min(3,route.step+1);render();return;}
 if(act==='intro-prev'){route.step=Math.max(0,route.step-1);render();return;}
 if(act==='intro-choice'){route.selected=Number(el.dataset.index);render();return;}
 if(act==='intro-check'){if(route.selected===null)return;let a=ab(route.id);route.checked=route.selected===a.correct;route.step=3;playSound(route.checked?'success':'retry');render();return;}
 if(act==='intro-retry'){route.step=2;route.selected=null;render();return;}
 if(act==='intro-done'){cur().introduced[route.id]={at:Date.now(),quizCorrect:!!route.checked};persist();if(route.returnTo==='session'&&route.pending){let p=route.pending;createSession(p.nodeId,p.abilityId,p.mode,p.review)}else navigate('ability',{id:route.id});return;}
 if(act==='choose'){let d=sessionDraft();if(!d||d.finished)return;d.choice=Number(el.dataset.index);persist();render();return;}
 if(act==='hint'){let d=sessionDraft();if(!d||d.finished)return;d.hints=Math.min(2,d.hints+1);persist();render();return;}
 if(act==='check-answer'){checkAnswer();return;}
 if(act==='next-task'){advance();return;}
 if(act==='add-piece'){const s=cur().activeSession,d=sessionDraft(),t=task(s.taskIds[s.index]);if(d.finished)return;let piece=t.options[Number(el.dataset.index)],total=t.options.filter(x=>x===piece).length,used=d.selection.filter(x=>x===piece).length;if(used<total&&d.selection.length<t.answer.length){d.selection.push(piece);persist();render();}return;}
 if(act==='remove-piece'){let d=sessionDraft();if(d.finished)return;d.selection.splice(Number(el.dataset.index),1);persist();render();return;}
 if(act==='clear-piece'){let d=sessionDraft();if(d.finished)return;d.selection=[];persist();render();return;}
 if(act==='toggle-grid'){let d=sessionDraft(),index=Number(el.dataset.index);if(d.finished)return;d.grid=d.grid.includes(index)?d.grid.filter(x=>x!==index):[...d.grid,index];persist();render();return;}
 if(act==='add-profile'){let name=prompt('给你的新档案取个名字（最多12个字）');if(!name)return;name=name.trim().slice(0,12);if(!name)return;if(db.profiles[name]){alert('这个名字已经存在，请换一个。');return;}db.profiles[name]=profileDefault(name,cur().grade);db.active=name;persist();navigate('profiles');return;}
 if(act==='export'){exportBackup();return;}
}
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-action]');if(!el)return;ev.preventDefault();if(!['sound','speak','stop-speak','intro-check','check-answer','next-task'].includes(el.dataset.action))playSound('tap');clickAction(el);});
document.addEventListener('change',ev=>{
 const target=ev.target;
 if(target.id==='profileSelect'){if(!db.profiles[target.value])return;db.active=target.value;persist();navigate('home');}
 if(target.id==='moduleFilter'){filter.module=target.value;$('knowledgeResults').innerHTML=knowledgeItems(D.nodes.filter(n=>(filter.module==='全部'||n.module===filter.module)&&(filter.grade==='全部'||n.suggested_grade===Number(filter.grade))&&(!filter.search||n.title.includes(filter.search))));}
 if(target.id==='gradeFilter'){filter.grade=target.value;$('knowledgeResults').innerHTML=knowledgeItems(D.nodes.filter(n=>(filter.module==='全部'||n.module===filter.module)&&(filter.grade==='全部'||n.suggested_grade===Number(filter.grade))&&(!filter.search||n.title.includes(filter.search))));}
 if(target.id==='abilityGrade'){abilityGrade=Number(target.value);storageSet('math-v41-ability-grade',abilityGrade);render();}if(target.id==='myGrade'){cur().grade=Number(target.value);persist();render();}
 if(target.id==='importFile'){const f=target.files?.[0];if(!f)return;if(f.size>2e6){alert('文件超过2MB，请检查文件是否为导出的学习记录。');return;}f.text().then(parseImport).catch(e=>alert('导入失败：'+e.message));}
});
document.addEventListener('input',ev=>{if(ev.target.id==='storyLabRange'){updateStoryLab(ev.target.value);return;}if(ev.target.id==='knowledgeSearch'){filter.search=ev.target.value;$('knowledgeResults').innerHTML=knowledgeItems(D.nodes.filter(n=>(filter.module==='全部'||n.module===filter.module)&&(filter.grade==='全部'||n.suggested_grade===Number(filter.grade))&&(!filter.search||n.title.includes(filter.search))));}
 if(ev.target.id==='mathAnswer'){let d=sessionDraft();if(!d.finished){d.input=ev.target.value;persist();let button=document.querySelector('[data-action="check-answer"]');if(button)button.disabled=!d.input.trim();}}
});

// V4.8 book gestures: preserve current node and route; ignore interactive drawings.
document.addEventListener('keydown',ev=>{
 const active=ev.target;
 if(active?.closest?.('[data-story-lab-handle]')&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')){
  ev.preventDefault();updateStoryLab((universeUI.labSplit||3)+(ev.key==='ArrowRight'?1:-1));return;
 }
 if(ev.altKey||ev.ctrlKey||ev.metaKey||/INPUT|TEXTAREA|SELECT/.test(active?.tagName||''))return;
 if((route.page==='universe'||route.page==='ability')&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')){
  if(active?.closest?.('[data-action]'))return;
  ev.preventDefault();clickAction({dataset:{action:'story-turn',id:(route.page==='universe'?'knowledge':'ability')+':'+(ev.key==='ArrowRight'?1:-1)}});
 }
});

// Desktop native drag-and-drop, with tap-to-build as a touchscreen alternative.
let dragIndex=null;
document.addEventListener('dragstart',ev=>{const x=ev.target.closest('[data-action="add-piece"]');if(!x)return;dragIndex=x.dataset.index;ev.dataTransfer?.setData('text/plain',dragIndex);if(ev.dataTransfer)ev.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',ev=>{if(ev.target.closest('#dropArea'))ev.preventDefault();});
document.addEventListener('drop',ev=>{if(!ev.target.closest('#dropArea'))return;ev.preventDefault();let x=document.querySelector(`[data-action="add-piece"][data-index="${dragIndex}"]`);if(x)clickAction(x);dragIndex=null;});
document.addEventListener('keydown',ev=>{const el=ev.target.closest('svg [data-action]');if(el&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();clickAction(el);return;}
 const stage=ev.target.closest('[data-book-stage]');if(stage&&(ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&!ev.target.closest('input,textarea,select,button,[data-story-lab-handle]')){ev.preventDefault();const kind=stage.dataset.bookStage;clickAction({dataset:{action:'story-turn',id:kind+':'+(ev.key==='ArrowRight'?1:-1)}});}
});

/* Gesture page turns stay off interactive controls and the zoomable nebula. */
let storyGesture=null,storyMouse=null,storyLastTurn=0;
const storyCanTurn=target=>!target.closest('button,input,textarea,select,a,[data-action],[data-story-lab-handle],[data-story-mind-handle],#cosmosViewport');
document.addEventListener('pointerdown',ev=>{
 const stage=ev.target.closest('[data-book-stage]');
 if(!stage||!storyCanTurn(ev.target))return;
 storyGesture={id:ev.pointerId,x:ev.clientX,y:ev.clientY,kind:stage.dataset.bookStage,at:Date.now()};
},{passive:true});
document.addEventListener('pointerup',ev=>{
 const g=storyGesture;if(!g||g.id!==ev.pointerId)return;storyGesture=null;
 const dx=ev.clientX-g.x,dy=ev.clientY-g.y;
 if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.4&&Date.now()-g.at<1500&&Date.now()-storyLastTurn>400){storyLastTurn=Date.now();storyMouse=null;clickAction({dataset:{action:'story-turn',id:g.kind+':'+(dx<0?1:-1)}});}
},{passive:true});
document.addEventListener('pointercancel',()=>{storyGesture=null},{passive:true});
/* Mouse fallback: native text selection can cancel pointer gestures on desktop. */
document.addEventListener('mousedown',ev=>{const stage=ev.target.closest('[data-book-stage]');if(!stage||!storyCanTurn(ev.target))return;storyMouse={x:ev.clientX,y:ev.clientY,kind:stage.dataset.bookStage,at:Date.now()};});
document.addEventListener('mouseup',ev=>{const g=storyMouse;storyMouse=null;if(!g||Date.now()-storyLastTurn<400)return;const dx=ev.clientX-g.x,dy=ev.clientY-g.y;if(Math.abs(dx)>75&&Math.abs(dx)>Math.abs(dy)*1.4&&Date.now()-g.at<1500){storyLastTurn=Date.now();clickAction({dataset:{action:'story-turn',id:g.kind+':'+(dx<0?1:-1)}});}});

document.addEventListener('input',ev=>{if(ev.target.id==='storyLabRange')updateStoryLab(ev.target.value);});

if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',()=>render(),{once:true});}else{render();}
window.MathGrowthV48={getData:()=>D, getSnapshot:()=>JSON.parse(JSON.stringify(db)),state:()=>({...route})};
})();
</script>
