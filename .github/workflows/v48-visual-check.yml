name: V4.8 visual storybook checks
on:
  push:
    branches:
      - feature/v48-storybook-visual-rebuild
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test six relationship views, old nebula, six abilities and live interactions
        run: node v48/tests/smoke.mjs
      - name: Save desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v48-visual-screenshots
          path: v48/tests/screenshots
          retention-days: 7
