name: V4.8 browser quality gate
on:
  push:
    branches:
      - feature/v48-storybook-visual-rebuild
  workflow_dispatch:
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-package-lock --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Desktop and mobile browser smoke test
        run: node v48/qa.browser.mjs
